[package]
name = "pineagent-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "pineagent"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
rust_socketio = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
