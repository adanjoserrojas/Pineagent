<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant companion · Motion review</title>
<style>body{margin:0;padding:32px;background:#080e18;color:#f2f5ff;font:15px system-ui}main{max-width:1100px;margin:auto}h1{font-size:36px;margin:8px 0}p{color:#a5b4c9}button{background:#172234;border:1px solid #304258;color:inherit;border-radius:12px;padding:12px;cursor:pointer}button[aria-pressed=true]{border-color:#65edb4}#choices{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}canvas{width:640px;height:340px;max-width:100%;border-radius:20px}#stage{display:flex;align-items:center;justify-content:center;padding:30px;background:#101a29;border-radius:24px}#meta{min-height:55px}a{color:#65edb4}#native{margin-left:8px}#error{color:#ff788b}</style>
<main><p>SWAMPHACKS / LIVE RIVE PLAYBACK</p><h1>A little face. Always alive.</h1><p>18 expressions · 320 × 170 landscape · continuous eye movement</p><div id="stage"><canvas id="face" width="640" height="340" aria-label="Animated plant companion face"></canvas></div><h2 id="title">Loading…</h2><p id="meta"></p><button id="pause">Pause</button><button id="native">Native size</button><span id="error"></span><div id="choices"></div><p>Editable sources: <a href="https://www.figma.com/design/0HTnuMyAMeuy01nco9QaOg">Figma</a> · <a href="https://editor.rive.app/file/pineapple/2654454">Rive</a></p></main>
<script src="rive.js"></script><script>
rive.RuntimeLoader.setWasmUrl('rive.wasm');
window.loaded=false;window.instances=[];let current=0,paused=false;
window.statesPromise=fetch('states.json').then(r=>r.json());
window.loadState=async function(i,autoplay=true){const states=await statesPromise,s=states[i];current=i;window.loaded=false;if(window.player)window.player.cleanup();await new Promise((resolve,reject)=>{window.player=new rive.Rive({src:'companion.riv',canvas:document.getElementById('face'),artboard:String(i+1).padStart(2,'0')+' · '+s.key,animations:s.key+'_loop',autoplay,layout:new rive.Layout({fit:rive.Fit.Contain,alignment:rive.Alignment.Center}),onLoad:()=>{window.loaded=true;resolve()},onLoadError:e=>{document.getElementById('error').textContent=JSON.stringify(e);reject(e)}})});document.getElementById('title').textContent=s.title+' · '+s.emotion;document.getElementById('meta').textContent=s.behavior+' '+s.timing;document.querySelectorAll('#choices button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));return window.player.contents;};
statesPromise.then(states=>{states.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s.title;b.onclick=()=>loadState(i,!paused);document.getElementById('choices').appendChild(b)});loadState(0)});
document.getElementById('pause').onclick=()=>{paused=!paused;paused?player.pause():player.play();document.getElementById('pause').textContent=paused?'Play':'Pause'};
document.getElementById('native').onclick=()=>{const c=document.getElementById('face'),small=c.style.width==='320px';c.style.width=small?'640px':'320px';c.style.height=small?'340px':'170px';};
</script></html>
