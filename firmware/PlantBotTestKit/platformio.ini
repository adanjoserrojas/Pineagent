; Optional: build with PlatformIO instead of Arduino IDE.
; pioarduino = community fork that ships Arduino-ESP32 core 3.x (stock PlatformIO is stuck on 2.x,
; which lacks ESP_I2S.h and the new ledcAttachChannel API this sketch uses).
[platformio]
src_dir = PlantBotTest

[env:plantbot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions-face-8mb.csv
board_build.arduino.memory_type = qio_opi   ; quad flash + octal PSRAM (N8R8 / N16R8)
board_upload.flash_size = 8MB              ; 16MB if the module says N16R8
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1          ; Hardware CDC + JTAG
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB port
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.6
monitor_speed = 115200
